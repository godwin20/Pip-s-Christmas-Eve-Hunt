<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pip's Christmas Eve Hunt</title>
    <meta name="description" content="A cosy 3D Christmas hunt for kids and families: help Pip the penguin find crackers and presents before morning." />
    <meta name="theme-color" content="#1b2450" />
    <!-- the game's own icons, on the same site, so this page makes no requests anywhere else -->
    <link rel="icon" type="image/png" sizes="32x32" href="/Pip-s-Christmas-Eve-Hunt/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/Pip-s-Christmas-Eve-Hunt/icons/apple-touch-icon.png" />
    <style>
      /* the game's night palette (src/styles.css: --night, --night-deep) */
      :root {
        color-scheme: dark;
        --night: #1b2450;
        --night-deep: #0f1533;
        --gold: #ffd93d;
        --snow: #f4f6ff;
        --mist: #c9d0f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: radial-gradient(circle at 50% 0%, #2c3a7a 0%, var(--night) 45%, var(--night-deep) 100%);
        color: var(--snow);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 30rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        padding: 28px 22px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      h1 {
        margin: 12px 0 4px;
        font-size: 1.6rem;
        line-height: 1.2;
      }
      p {
        margin: 12px 0;
      }
      .play {
        display: inline-block;
        margin-top: 8px;
        padding: 14px 26px;
        border-radius: 999px;
        background: var(--gold);
        color: var(--night);
        font-weight: 700;
        font-size: 1.1rem;
        text-decoration: none;
      }
      .small {
        font-size: 0.9rem;
        color: var(--mist);
      }
      .small a {
        color: var(--snow);
      }
      a:focus-visible {
        outline: 3px solid var(--snow);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/Pip-s-Christmas-Eve-Hunt/icons/icon-192.png" alt="" width="96" height="96" />
      <h1>Pip's Christmas Eve Hunt</h1>
      <p>A cosy 3D Christmas hunt for kids and families. Help Pip the penguin find crackers and presents on a new snowy island every night, before morning comes.</p>
      <p><a class="play" href="/Pip-s-Christmas-Eve-Hunt/">Play in your browser</a></p>
      <p class="small">
        For grown-ups:
        <a href="/Pip-s-Christmas-Eve-Hunt/privacy.html">Privacy policy</a>
        ·
        <a href="/Pip-s-Christmas-Eve-Hunt/delete-data.html">Delete your saved data</a>
      </p>
      <p class="small">Made by godwin20.</p>
    </main>
  </body>
</html>
