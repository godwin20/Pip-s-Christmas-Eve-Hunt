<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the night sky reaches under the notch and home bar; the menus and HUD keep to the safe area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pip's Christmas Eve Hunt</title>
    <meta name="description" content="A cosy 3D Christmas hunt: help Pip the penguin find crackers and presents before morning." />
    <meta name="theme-color" content="#1b2450" />
    <!-- installed app (see vite.config.js for the web app manifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- not black-translucent: Apple deprecated drawing under the status bar, and
         iOS 26.1+ lays a grey scrim over it. iOS only reads this when the app is
         added to the Home Screen, so a change needs a reinstall. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Pip's Hunt" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud"></div>
      <div id="popups"></div>
      <div id="screens"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
